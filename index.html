<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список справ (To-Do List)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Мій список справ</h1>

    <!-- Форма додавання нового завдання -->
    <form id="todo-form" class="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Що потрібно зробити?" 
        autocomplete="off"
      >
      <button type="submit" id="add-btn">Додати</button>
    </form>

    <!-- Фільтри та лічильник -->
    <div class="controls">
      <span id="task-counter">Залишилося завдань: 0</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Всі</button>
        <button class="filter-btn" data-filter="active">Активні</button>
        <button class="filter-btn" data-filter="completed">Виконані</button>
      </div>
    </div>

    <!-- Список завдань -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- Панель дій -->
    <div class="footer-actions">
      <button id="clear-completed-btn" class="clear-btn">Очистити виконані</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
